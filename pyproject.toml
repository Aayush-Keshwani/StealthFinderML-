[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stealth-spend"
version = "1.0.0"
description = "Financial Behavior Modeler & Anomaly Detector"
authors = [{ name = "Stealth-Spend Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.2",
    "joblib>=1.3.0",
]

[project.scripts]
stealth-spend = "stealth_spend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
