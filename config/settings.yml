# Stealth-Spend Configuration Settings
project:
  name: "Stealth-Spend"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_data: "data/raw"
  interim_data: "data/interim"
  processed_data: "data/processed"
  synthetic_data: "data/synthetic"
  models: "models"
  reports: "reports"
  figures: "reports/figures"
  generated_reports: "reports/generated"

ingestion:
  amount_convention: "negative_debit"  # debits < 0, credits > 0
  date_format: "ISO"
  default_currency: "USD"

categorization:
  test_size: 0.25
  min_confidence_threshold: 0.40  # Below this threshold, category marked as 'Needs Review'
  model_type: "xgboost"
  max_features_tfidf: 1000
  ngram_range: [1, 2]

anomaly_detection:
  contamination: 0.05
  near_duplicate_window_days: 3
  amount_deviation_threshold_zscore: 2.5
  recurring_increase_pct_threshold: 0.15
  top_k_review: 20

clustering:
  min_k: 2
  max_k: 6
  optimal_k: 3

forecasting:
  test_days: 30
  lag_days: [1, 7, 14, 28]
  rolling_windows: [7, 14, 30]
  low_balance_threshold: 500.0
